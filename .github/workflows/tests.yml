name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[fast,test]"
      - name: Verify email validation dependencies
        run: |
          python -m pip show pydantic email-validator
          python -c "import email_validator; from pydantic import EmailStr; print('Email validation dependency OK')"
      - run: python -m unittest discover -s tests -v
